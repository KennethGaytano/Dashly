<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Home</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/home.css">
    <link rel="stylesheet" href="styles/tasks.css">
    <link rel="stylesheet" href="styles/notes.css">
</head>
<body>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="sidebar" aria-label="Open navigation menu">
        <span class="icon-open" aria-hidden="true">☰</span>
        <span class="icon-close" aria-hidden="true">✕</span>
    </button>

    <button type="button" class="nav-scrim" tabindex="-1" aria-hidden="true"></button>

    <aside id="sidebar">
        <div class="sidebar-logo">
            <h2><span aria-hidden="true">📊</span> Dashboard</h2>
        </div>
        <nav class="sidebar-nav" aria-label="Main">
            <a href="index.html" class="active" aria-current="page">
                <span class="nav-icon" aria-hidden="true">🏠</span> Home
            </a>
            <a href="pages/tasks.html">
                <span class="nav-icon" aria-hidden="true">✅</span> Tasks
            </a>
            <a href="pages/calendar.html">
                <span class="nav-icon" aria-hidden="true">📅</span> Calendar
            </a>
            <a href="pages/notes.html">
                <span class="nav-icon" aria-hidden="true">📝</span> Notes
            </a>
            <a href="pages/progress.html">
                <span class="nav-icon" aria-hidden="true">📈</span> Progress
            </a>
            <a href="pages/goals.html">
                <span class="nav-icon" aria-hidden="true">🎯</span> Goals
            </a>
        </nav>
    </aside>

    <main id="main-content">

        <header>
            <h1 id="greeting">Welcome back! <span aria-hidden="true">👋</span></h1>
            <p>Welcome to your personal dashboard.</p>
        </header>

        <section>
            <h2>Overview</h2>
            <div class="stats-grid">
                <a href="pages/tasks.html" class="stat-card">
                    <div class="stat-icon" aria-hidden="true">✅</div>
                    <h3>Tasks</h3>
                    <p class="stat-value">0/5</p>
                </a>
                <a href="pages/progress.html" class="stat-card">
                    <div class="stat-icon" aria-hidden="true">⏱️</div>
                    <h3>Study Time</h3>
                    <p class="stat-value" id="homeStudyTime">0h 00m</p>
                </a>
                <a href="pages/progress.html" class="stat-card">
                    <div class="stat-icon" aria-hidden="true">📁</div>
                    <h3>Projects</h3>
                    <p class="stat-value" id="homeProjects">3</p>
                </a>
                <a href="pages/progress.html" class="stat-card">
                    <div class="stat-icon" aria-hidden="true">🔥</div>
                    <h3>Streak</h3>
                    <p class="stat-value" id="homeStreak">7 days</p>
                </a>
            </div>
        </section>

        <div class="two-col">
            <section>
                <div class="section-header section-header--stacked">
                    <h2>Today's Tasks</h2>
                    <a href="pages/tasks.html" class="section-link">View all →</a>
                </div>
                <div class="card">
                    <div class="task-list" id="homeTaskList">
                        <!-- Dynamically loaded from localStorage via home.js -->
                    </div>
                </div>
            </section>

            <section>
                <div class="section-header section-header--stacked">
                    <h2>Pomodoro</h2>
                    <div class="mode-switch" role="group" aria-label="Timer mode">
                        <button type="button" class="mode-btn is-active" aria-pressed="true">Focus</button>
                        <button type="button" class="mode-btn" aria-pressed="false">Break</button>
                    </div>
                </div>
                <div class="card pomodoro">
                    <div class="timer-display" aria-live="polite" aria-atomic="true">25:00</div>
                    <div class="timer-controls">
                        <div class="minute-field">
                            <label for="minuteInput" class="minute-label">Minutes</label>
                            <input type="number" id="minuteInput" class="minute-input" min="1" max="120" value="25" />
                        </div>
                        <div class="timer-buttons">
                            <button class="btn btn-primary">▶ Start</button>
                            <button class="btn btn-secondary">↺ Reset</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <section>
            <div class="section-header section-header--stacked">
                <h2>Quick Notes</h2>
                <a href="pages/notes.html" class="section-link">View all →</a>
            </div>
            <div class="card quick-note-composer">
                <form id="quickNoteForm" class="quick-note-form">
                    <label for="quickNoteTitle" class="visually-hidden">Quick note title</label>
                    <input
                        type="text"
                        id="quickNoteTitle"
                        name="title"
                        placeholder="Quick thought…"
                        required
                        aria-required="true"
                    >
                    <button type="submit" class="btn btn-primary">Save</button>
                </form>
            </div>
            <div id="quickNotesList" class="notes-grid"></div>
        </section>

    </main>

    <script src="scripts/nav.js"></script>
    <script src="scripts/home.js"></script>
    <script src="scripts/pomodoro.js"></script>
    <script src="scripts/quick-notes.js"></script>
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>
</body>
</html>
