<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" role="img" aria-label="Dashly" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Dashly</title>
  <style>
    .word { fill: #14213D; }
    @media (prefers-color-scheme: dark) { .word { fill: #F5F7FA; } }
  </style>
  <!-- Mark: a tile holding three staggered dashes, like widgets on a dashboard -->
  <rect x="20" y="30" width="120" height="120" rx="30" fill="#14213D"/>
  <line x1="46" y1="64" x2="114" y2="64" stroke="#2EC4B6" stroke-width="14" stroke-linecap="round"/>
  <line x1="46" y1="90" x2="94" y2="90" stroke="#F5F7FA" stroke-width="14" stroke-linecap="round"/>
  <line x1="46" y1="116" x2="72" y2="116" stroke="#FFC857" stroke-width="14" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text class="word" x="168" y="122" font-family="'Nunito','Poppins','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="-2">Dashly</text>
</svg>
