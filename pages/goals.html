<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Goals</title>
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/goals.css">
    <link rel="stylesheet" href="../styles/progress.css">
    <link rel="stylesheet" href="../styles/tasks.css">
</head>
<body>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="sidebar" aria-label="Open navigation menu">
        <span class="icon-open" aria-hidden="true">☰</span>
        <span class="icon-close" aria-hidden="true">✕</span>
    </button>

    <button type="button" class="nav-scrim" tabindex="-1" aria-hidden="true"></button>

    <aside id="sidebar">
        <div class="sidebar-logo">
            <h2><span aria-hidden="true">📊</span> Dashboard</h2>
        </div>
        <nav class="sidebar-nav" aria-label="Main">
            <a href="../index.html">
                <span class="nav-icon" aria-hidden="true">🏠</span> Home
            </a>
            <a href="tasks.html">
                <span class="nav-icon" aria-hidden="true">✅</span> Tasks
            </a>
            <a href="calendar.html">
                <span class="nav-icon" aria-hidden="true">📅</span> Calendar
            </a>
            <a href="notes.html">
                <span class="nav-icon" aria-hidden="true">📝</span> Notes
            </a>
            <a href="progress.html">
                <span class="nav-icon" aria-hidden="true">📈</span> Progress
            </a>
            <a href="goals.html" class="active" aria-current="page">
                <span class="nav-icon" aria-hidden="true">🎯</span> Goals
            </a>
        </nav>
    </aside>

    <main id="main-content">

        <header>
            <h1>Goals <span aria-hidden="true">🎯</span></h1>
            <p>Set targets and track milestones.</p>
        </header>

        <!-- Add/Edit Goal Form -->
        <section>
            <h2 id="formTitle">Add a Goal</h2>
            <div class="card">
                <form id="goalForm" class="task-form">
                    <div class="form-group">
                        <label for="goalTitle" class="form-label">Goal Title <span class="required">*</span></label>
                        <input
                            type="text"
                            id="goalTitle"
                            name="title"
                            placeholder="Launch portfolio website"
                            required
                            aria-required="true"
                        >
                    </div>

                    <div class="form-group">
                        <label for="goalDesc" class="form-label">Description</label>
                        <textarea
                            id="goalDesc"
                            name="desc"
                            placeholder="What does success look like?"
                            rows="2"
                        ></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="goalStatus" class="form-label">Status</label>
                            <select id="goalStatus" name="status">
                                <option value="active" selected>Active</option>
                                <option value="paused">Paused</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="goalProgress" class="form-label">Progress (%)</label>
                            <input
                                type="number"
                                id="goalProgress"
                                name="progress"
                                min="0"
                                max="100"
                                step="1"
                                value="0"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="milestones" class="form-label">Milestones (bulleted checklist)</label>
                        <div id="milestoneRows" style="display:flex;flex-direction:column;gap:0.4rem;">
                            <div class="milestone-row" style="display:flex;gap:0.5rem;align-items:center;">
                                <input type="text" name="milestones[]" placeholder="Milestone..." value="" class="form-input-inline" style="flex:1;width:100%;">
                                <button type="button" onclick="removeMilestoneRow(this)" aria-label="Remove milestone" class="btn-icon danger">✕</button>
                            </div>
                        </div>
                        <button type="button" onclick="addMilestoneRow()" class="btn btn-secondary" style="margin-top:0.5rem;">+ Add milestone</button>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="submitBtn" class="btn btn-primary">+ Add Goal</button>
                        <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Goal Cards -->
        <section>
            <div class="goals-header">
                <h2>My Goals</h2>
                <button type="button" class="btn btn-primary" id="newGoalBtn">+ New Goal</button>
            </div>

            <div id="goalsList" class="goals-list">
                <!-- Dynamically populated by goals.js -->
            </div>
        </section>

    </main>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <h3 id="modalTitle">Delete Goal</h3>
            <p id="confirmMessage">Are you sure you want to delete this goal?</p>
            <div class="modal-actions">
                <button type="button" id="cancelModal" class="btn btn-secondary">Cancel</button>
                <button type="button" id="confirmDelete" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <script src="../scripts/nav.js"></script>
    <script src="../scripts/goals.js"></script>

</body>
</html>
